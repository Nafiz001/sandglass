name: WebGL

# Builds the browser game with GameCI and copies it to the Oracle server,
# where Caddy serves it beside the match server. Needs these repository
# secrets; without them the workflow reports that and stops:
#   UNITY_LICENSE   contents of a Unity Personal .ulf licence file
#   UNITY_EMAIL     Unity account email
#   UNITY_PASSWORD  Unity account password
#   DEPLOY_SSH_KEY  a private key the server's ubuntu user accepts

on:
  push:
    branches: [main]
    paths: ["Assets/**", "Packages/**", "ProjectSettings/**", ".github/workflows/webgl.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Unity or deploy secrets are not set; skipping the WebGL build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-WebGL-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: Sandglass.EditorTools.BuildWebGL.Build

      - name: Copy to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ubuntu@130.210.37.18
        run: |
          install -m 600 /dev/null ~/key && printf '%s\n' "$DEPLOY_SSH_KEY" > ~/key
          tar czf - -C Builds/WebGL index.html Build | ssh -i ~/key -o StrictHostKeyChecking=accept-new "$HOST" '
            set -e; d=/opt/portfolio/vernissage/home/sandglass
            rm -rf $d.new && mkdir -p $d.new && tar xzf - -C $d.new
            rm -rf $d.old; [ -d $d ] && mv $d $d.old; mv $d.new $d; rm -rf $d.old'
