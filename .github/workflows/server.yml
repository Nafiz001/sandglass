name: Server

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  image:
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: Nafiz001/portfolio-deploy/.github/workflows/image.yml@main
    with:
      image: sandglass-server
      context: server
